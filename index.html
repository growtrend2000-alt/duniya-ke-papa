<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forever Mine · Romantic Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-black: #080507;
    --card-dark: #120b0f;
    --border-pink: rgba(255, 77, 126, 0.2);
    --primary-red: #ff1e56;
    --accent-pink: #ff4d7e;
    --text-white: #ffffff;
    --text-muted: #b3a4ab;
    --radius: 24px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-black);
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(255, 30, 86, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255, 77, 126, 0.08) 0%, transparent 40%);
    color: var(--text-white);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow: hidden;
  }

  .love-container {
    width: min(100%, 400px);
    background: var(--card-dark);
    border: 1px solid var(--border-pink);
    border-radius: var(--radius);
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 30, 86, 0.15);
  }

  .heart-box {
    font-size: 48px;
    color: var(--primary-red);
    animation: pulseHeart 1.5s infinite ease-in-out;
    margin-bottom: 12px;
  }

  @keyframes pulseHeart {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  h1 span {
    color: var(--accent-pink);
  }

  .tagline {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 28px;
  }

  .message-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-pink);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-white);
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
  }

  .romantic-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--primary-red), var(--accent-pink));
    color: var(--text-white);
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 30, 86, 0.35);
    transition: transform 0.2s, filter 0.2s;
  }

  .romantic-btn:active {
    transform: scale(0.97);
  }

  .romantic-btn:hover {
    filter: brightness(1.1);
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    margin-top: 28px;
    gap: 10px;
  }

  .stat-box {
    flex: 1;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border-pink);
    border-radius: 14px;
    padding: 12px 8px;
  }

  .stat-value {
    display: block;
    font-size: 16px;
    font-weight: 800;
    color: var(--accent-pink);
    margin-bottom: 2px;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .footer-note {
    margin-top: 24px;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Popup Modal Styles with Absolute Position for Swifting */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
  }

  .modal-box {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--card-dark);
    border: 2px solid var(--accent-pink);
    border-radius: var(--radius);
    padding: 30px 20px;
    width: min(90%, 320px);
    text-align: center;
    box-shadow: 0 0 40px rgba(255, 77, 126, 0.3);
    transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .modal-heart {
    font-size: 40px;
    color: var(--primary-red);
    margin-bottom: 10px;
  }

  .modal-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-white);
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }

  .modal-buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .btn-yes, .btn-no {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-yes {
    background: linear-gradient(135deg, var(--primary-red), var(--accent-pink));
    color: white;
    border: none;
    box-shadow: 0 4px 15px rgba(255, 30, 86, 0.4);
  }

  .btn-no {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    border: 1px solid var(--border-pink);
  }

  .success-msg {
    display: none;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-pink);
    margin-top: 15px;
  }
</style>
</head>
<body>

  <!-- Popup Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <div class="modal-heart">💖</div>
      <div class="modal-title">I LOVE YOU ANCHAL</div>
      <div class="modal-buttons" id="buttonArea">
        <button class="btn-yes" id="yesBtn">I Love You 2 ❤️</button>
        <button class="btn-no" id="noBtn">No</button>
      </div>
      <div class="success-msg" id="successMsg">Yay! Mujhe pata tha! 🥰✨</div>
    </div>
  </div>

  <div class="love-container">
    <div class="heart-box">❤️</div>
    <h1>Forever <span>Mine</span></h1>
    <p class="tagline">A special place built with pure love</p>

    <div class="message-card" id="quoteText">
      "You are my today and all of my tomorrows. ✨"
    </div>

    <button class="romantic-btn" id="surpriseBtn">Click For Surprise 💖</button>

    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-value">100%</span>
        <span class="stat-label">Loyalty</span>
      </div>
      <div class="stat-box">
        <span class="stat-value">∞</span>
        <span class="stat-label">Endless</span>
      </div>
      <div class="stat-box">
        <span class="stat-value">True</span>
        <span class="stat-label">Connection</span>
      </div>
    </div>

    <div class="footer-note">Created With Love</div>
  </div>

  <script>
    // Quotes logic
    const quotes = [
      "In a world full of chaos, you are my absolute peace. 🌹",
      "I still fall for you a little bit more every single day. 🖤",
      "You hold the key to my heart, and it stays with you forever. ✨",
      "Together is my most favorite place in the entire universe. 💖",
      "Every second spent with you feels like a beautiful dream. 🌸"
    ];

    const btn = document.getElementById("surpriseBtn");
    const quoteBox = document.getElementById("quoteText");

    btn.addEventListener("click", () => {
      const randomIdx = Math.floor(Math.random() * quotes.length);
      quoteBox.style.opacity = 0;
      setTimeout(() => {
        quoteBox.textContent = quotes[randomIdx];
        quoteBox.style.opacity = 1;
      }, 250);
    });

    // Swift Pop-up Logic on clicking 'No'
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const modalBox = document.getElementById("modalBox");
    const modalOverlay = document.getElementById("modalOverlay");
    const successMsg = document.getElementById("successMsg");
    const buttonArea = document.getElementById("buttonArea");

    function swiftPopup() {
      // Screen ke andar random position calculate karna taaki box screen se bahar na jaye
      const padding = 20;
      const maxX = window.innerWidth - modalBox.clientWidth - padding;
      const maxY = window.innerHeight - modalBox.clientHeight - padding;
      
      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      modalBox.style.left = randomX + "px";
      modalBox.style.top = randomY + "px";
      modalBox.style.transform = "translate(0, 0)"; // Center transform hatana zaroori hai
    }

    noBtn.addEventListener("click", swiftPopup);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      swiftPopup();
    });

    yesBtn.addEventListener("click", () => {
      buttonArea.style.display = "none";
      successMsg.style.display = "block";
      setTimeout(() => {
        modalOverlay.style.opacity = "0";
        modalOverlay.style.transition = "opacity 0.5s ease";
        setTimeout(() => modalOverlay.remove(), 500);
      }, 1500);
    });
  </script>

</body>
</html>
